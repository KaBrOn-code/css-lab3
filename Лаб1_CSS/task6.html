<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 6</title>
    <style>
        body {
            font-family: Arial;
        }
        a {
            text-decoration: none;
        }
        .link {
            color: cornflowerblue;
        }
        .link:visited {
            color: sandybrown;
        }
        .link:hover {
            color: hotpink;
        }
        .link:active {
            color: yellowgreen;
        }
        .pseudolink {
            color: black;
        }
        .pseudolink:hover {
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <p><a class="link" href="https://example.com/">link</a></p>
    <p><a class="pseudolink" href="#">pseudolink</a></p>
</body>
</html>
